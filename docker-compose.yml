version: '3.8'

services:
  # =========================================================
  # 1. Database Service: MySQL 8.0
  # =========================================================
  mysql:
    image: mysql:8.0
    container_name: nexus_mysql
    restart: always
    stop_grace_period: 30s
    env_file:
      - ./backend/.env.mysql
    ports:
      # Chỉ bind vào localhost để dev/debug, không expose ra public Internet
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Dùng ping --silent: không lộ password trong process list (ps aux) và tránh warning log
      test: ["CMD-SHELL", "mysqladmin ping -h localhost --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    networks:
      - nexus_network

  # =========================================================
  # 2. Backend Service: Express API (NEXUS Cloud Cyber OS)
  # =========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus_backend
    restart: always
    stop_grace_period: 20s
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
    ports:
      - "${PORT:-3001}:3001"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - nexus_network

  # =========================================================
  # 3. Frontend Service: Vite / React + Nginx SPA
  # =========================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus_frontend
    restart: always
    stop_grace_period: 10s
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - nexus_network

  # =========================================================
  # 4. Code Quality & Security: SonarQube (CI / Audit Tool)
  # =========================================================
  sonarqube:
    image: sonarqube:community
    container_name: nexus_sonarqube
    restart: unless-stopped
    # Dùng profile 'tools': Không tự động chạy khi 'docker compose up' thông thường, tiết kiệm 2GB+ RAM
    profiles:
      - tools
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    networks:
      - nexus_network

networks:
  nexus_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local
