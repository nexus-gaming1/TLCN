# ===================================================================
# SonarQube / SonarCloud Scanner Configuration (NEXUS Cloud Cyber OS)
# ===================================================================

# Project Key, Organization & Name
sonar.projectKey=nexus-gaming1_TLCN
sonar.organization=nexus-gaming1
sonar.projectName=NEXUS Cloud Cyber OS
sonar.projectVersion=1.0.0

# Source & Test Paths (Tách biệt nguồn code và kiểm thử)
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**/*.test.js,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx

# Exclusions (Loại trừ thư viện ngoài, artifacts, build, C# desktop client)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.config.js,\
  **/*.config.cjs,\
  **/public/**,\
  NetClient/**,\
  NexusControl/**,\
  graphify/**

# Character Encoding
sonar.sourceEncoding=UTF-8

# Test Execution & Code Coverage Reports
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Quality Gate & Security Hotspots Thresholds
sonar.qualitygate.wait=true
sonar.cpd.exclusions=**/tests/**,**/migrations/**,**/seeders/**
