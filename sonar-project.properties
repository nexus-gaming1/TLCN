# ===================================================================
# SonarQube / SonarCloud Scanner Configuration (NEXUS Cloud Cyber OS)
# ===================================================================

# Project Key, Organization & Name
sonar.projectKey=nexus-gaming1_TLCN
sonar.organization=nexus-gaming1
sonar.projectName=NEXUS Cloud Cyber OS
sonar.projectVersion=1.0.0
sonar.host.url=https://sonarcloud.io

# Source & Test Paths (Tách biệt nguồn code và kiểm thử)
sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.test.js

# Exclusions (Loại trừ thư viện ngoài, artifacts, build, C# desktop client)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.config.js,\
  **/*.config.cjs,\
  **/public/**,\
  NetClient/**,\
  NexusControl/**,\
  graphify/**,\
  frontend/src/**/*.test.js,\
  frontend/src/**/*.test.jsx,\
  backend/src/utils/initTestDb.js

# Coverage Exclusions (Loại trừ các file script khởi tạo, migrations, seeders khỏi yêu cầu độ phủ kiểm thử)
sonar.coverage.exclusions=\
  backend/src/utils/initTestDb.js,\
  backend/src/utils/seeder.js,\
  backend/src/utils/migrationRunner.js,\
  backend/src/migrations/**,\
  backend/src/seeders/**,\
  **/*.test.js,\
  **/*.test.jsx

# Character Encoding
sonar.sourceEncoding=UTF-8

# Test Execution & Code Coverage Reports
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Quality Gate & Security Hotspots Thresholds
sonar.qualitygate.wait=false
sonar.cpd.exclusions=**/tests/**,**/migrations/**,**/seeders/**
