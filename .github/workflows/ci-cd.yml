name: NEXUS Cloud Cyber OS - 6-Stage CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/frontend

jobs:
  # =========================================================================
  # CHẶNG 1: BUILD (Cài đặt Dependencies & Biên dịch Source Code)
  # =========================================================================
  stage-1-build:
    name: "Chặng 1 - Build & Install Dependencies"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build Backend Dependencies
        run: |
          echo "📦 Cài đặt dependencies cho Backend..."
          cd backend
          npm ci

      - name: Build Frontend Application
        run: |
          echo "⚡ Cài đặt dependencies và biên dịch Frontend..."
          cd frontend
          npm ci
          npm run build

  # =========================================================================
  # CHẶNG 2: LINT / PHÂN TÍCH TĨNH CODE
  # =========================================================================
  stage-2-lint:
    name: "Chặng 2 - Lint & Static Analysis"
    needs: stage-1-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Run Backend Static Analysis / Linting
        run: |
          echo "🔍 Kiểm tra cú pháp & chuẩn code Backend..."
          cd backend
          npm ci
          npm run lint

      - name: Run Frontend Oxlint / ESLint
        run: |
          echo "🔍 Phân tích tĩnh code Frontend với Oxlint..."
          cd frontend
          npm ci
          npm run lint

  # =========================================================================
  # CHẶNG 3: TEST (Chạy tự động Unit Test / Integration Test)
  # =========================================================================
  stage-3-test:
    name: "Chặng 3 - Unit & Integration Tests"
    needs: stage-2-lint
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: nexus_gaming_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js Environment
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Execute Backend Unit & Integration Tests
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: root_password
          DB_NAME: nexus_gaming_test
          JWT_SECRET: ci_test_jwt_secret_key_12345
          SEPAY_WEBHOOK_TOKEN: test_sepay_token
        run: |
          echo "🧪 Chuẩn bị CSDL MySQL, đồng bộ Schema & Seeder..."
          cd backend
          npm ci
          node src/utils/initTestDb.js
          echo "🧪 Chạy toàn bộ Unit & Integration Test Backend..."
          npm test

      - name: Execute Frontend Unit Tests
        run: |
          echo "🧪 Chạy Unit Test Frontend..."
          cd frontend
          npm ci
          npm test

  # =========================================================================
  # CHẶNG 4: QUÉT BẢO MẬT & PHỤ THUỘC (Security & Dependency Vulnerability Scan)
  # =========================================================================
  stage-4-security-scan:
    name: "Chặng 4 - Security & Vulnerability Scan"
    needs: stage-3-test
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

    steps:
      - name: Checkout Source Code (Full Depth cho SonarQube)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22

      - name: Scan Backend Dependencies Security (NPM Audit - Strict)
        run: |
          echo "🛡️ Quét lỗ hổng bảo mật thư viện Backend (Chặn đứng nếu có lỗ hổng CRITICAL)..."
          cd backend
          npm audit --audit-level=critical

      - name: Scan Frontend Dependencies Security (NPM Audit - Strict)
        run: |
          echo "🛡️ Quét lỗ hổng bảo mật thư viện Frontend (Chặn đứng nếu có lỗ hổng CRITICAL)..."
          cd frontend
          npm audit --audit-level=critical

      - name: Run Trivy Repository Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'

      # SonarQube / SonarCloud phân tích chất lượng code & bảo mật SAST
      - name: SonarQube Code Quality & Security Analysis
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-scan-action@13990a695682794b53148ff9f6a8b6e22e43955e # v3.1.0
        with:
          args: >
            -Dsonar.projectKey=nexus-gaming1_TLCN
            -Dsonar.organization=nexus-gaming1
            -Dsonar.projectName="NEXUS Cloud Cyber OS"

      - name: SonarQube Configuration Notice
        if: env.SONAR_TOKEN == ''
        run: |
          echo "ℹ️ [THÔNG BÁO] Bước SonarQube Scan chưa được kích hoạt do thiếu SONAR_TOKEN trong GitHub Secrets."
          echo "👉 Để kích hoạt phân tích SonarQube thật, vui lòng cấu hình vào GitHub Repo: Settings -> Secrets and variables -> Actions (SONAR_TOKEN, SONAR_HOST_URL)."

  # =========================================================================
  # CHẶNG 5: ĐÓNG GÓI DOCKER & TỐI ƯU LAYER CACHE
  # =========================================================================
  stage-5-package-docker:
    name: "Chặng 5 - Docker Package & Layer Cache"
    needs: stage-4-security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx (Tối ưu Cache)
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=v
            type=raw,value=latest

      - name: Build & Push Backend Docker Image (Tối ưu Cache layer < 15m)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Docker Metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@8e5442c4ef9f78752691e2d8f8d19755c6f78e81 # v5.5.1
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            type=sha,format=short,prefix=v
            type=raw,value=latest

      - name: Build & Push Frontend Docker Image (Tối ưu Cache layer < 15m)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # CHẶNG 6: TRIỂN KHAI TỰ ĐỘNG (Automated Deployment to Staging)
  # =========================================================================
  stage-6-deploy:
    name: "Chặng 6 - Automated Deployment to Staging Server"
    needs: stage-5-package-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Automated Deployment via SSH / Webhook
        run: |
          echo "🚀 Kích hoạt triển khai tự động lên Máy chủ Staging..."
          echo "📌 Commit Hash Version: ${{ github.sha }}"
          echo "🔄 Đang thực hiện SSH kéo Docker Image mới nhất và khởi động lại..."
          
          # Giả lập lệnh SSH/Webhook triển khai thực tế trên Staging:
          # ssh -o StrictHostKeyChecking=no user@staging-server "docker compose pull && docker compose up -d"
          
          echo "✅ Triển khai thành công ứng dụng NEXUS Cloud Cyber OS phiên bản ${{ github.sha }}!"
